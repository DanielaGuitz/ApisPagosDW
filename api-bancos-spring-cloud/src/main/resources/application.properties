spring.application.name=api-bancos-spring-cloud
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
# URL del API Gateway del ERP
erp.base-url=${ERP_BASE_URL:http://localhost:3000}
erppaymentssimulator.security.apiKeyAuth.key=${ERP_API_KEY:}

# RabbitMQ Local
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER:guest}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS:}

# Conexión al Monolito Local (Docker)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:gota_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:}

# URLs de AWS
aws.bank.url=${AWS_BANK_URL:https://example.invalid}
aws.erp.url=${AWS_ERP_URL:https://example.invalid}
aws.api.key=${AWS_API_KEY:}
aws.basic.auth=${AWS_BASIC_AUTH:}

# DynamoDB Local (Docker)
aws.dynamodb.endpoint=${DYNAMODB_ENDPOINT:http://localhost:8000}
aws.dynamodb.region=${AWS_REGION:us-east-1}

# Modo de confirmación manual
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Reintentos automáticos de Spring (3 intentos con 2 segundos de espera)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000


